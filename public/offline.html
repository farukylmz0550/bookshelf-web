<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Book Shelf — Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #faf0e1;
      color: #2b2727;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1d2020; color: #f2eee8; }
      .card { background: #272a29; border-color: #444845; }
      .btn { background: #c17a5e; color: #ffffff; }
      p { color: #8f8b84; }
    }
    .container {
      text-align: center;
      max-width: 320px;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 1.25rem;
      image-rendering: -webkit-optimize-contrast;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.8125rem;
      color: #8a8584;
      line-height: 1.5;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ded8d2;
      border-radius: 1rem;
      padding: 2rem;
    }
    .btn {
      margin-top: 1.5rem;
      display: inline-block;
      padding: 0.625rem 1.5rem;
      background: #bb4f35;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="/icon-192.png" alt="Book Shelf" class="logo" />
      <h1>No Internet Connection</h1>
      <p>Please check your connection and try again.</p>
      <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
  </div>
</body>
</html>
