services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/bookshelf.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      ANDROID_SHA256_FINGERPRINT: ${ANDROID_SHA256_FINGERPRINT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "${APP_PORT:-1024}:3000"
    volumes:
      - app-data:/data
      # v3.0.0 — site-wide configuration (XP levels, backfill, Kobo). Edit the
      # host copy and restart the container to apply.
      - ./config.yaml:/app/config.yaml:ro

  # Daily streak push reminders — requires CRON_SECRET + VAPID keys.
  # Uses the same image; node fetch loop (no extra tooling needed).
  cron:
    build: .
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: ["node", "-e"]
    command: >
      "const auth = 'Bearer ' + process.env.CRON_SECRET;
       const urls = [
         ['streak-remind', 'http://app:3000/api/push/streak-remind'],
         ['overdue-remind', 'http://app:3000/api/push/overdue-remind'],
         ['goal-progress', 'http://app:3000/api/push/goal-progress'],
         ['backup', 'http://app:3000/api/backup']
       ];
       async function tick() {
         for (const [name, url] of urls) {
           try {
             const res = await fetch(url, { method: 'POST', headers: { Authorization: auth } });
             console.log('[cron]', name + ':', res.status);
           } catch (err) { console.log('[cron] failed:', name, err.message); }
         }
       }
       (async () => { await tick(); })();
       setInterval(tick, 24 * 60 * 60 * 1000);"
    environment:
      CRON_SECRET: ${CRON_SECRET:-}

volumes:
  app-data:
