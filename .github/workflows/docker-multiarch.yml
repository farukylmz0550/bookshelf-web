name: Build and Push Multi-Arch Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v3.16.0)"
        required: true
        default: "v3.16.0"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/farukylmz0550/bookshelf:v3.16.0
            ghcr.io/farukylmz0550/bookshelf:latest
            ghcr.io/farukylmz0550/bookshelf-web:v3.16.0
            ghcr.io/farukylmz0550/bookshelf-web:latest
