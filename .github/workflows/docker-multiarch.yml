name: Build and Push Multi-Arch Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v3.16.0)"
        required: true
        default: "v3.16.0"
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "value=v3.16.0" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (bookshelf & bookshelf-web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/farukylmz0550/bookshelf:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/farukylmz0550/bookshelf:latest
            ${{ env.REGISTRY }}/farukylmz0550/bookshelf-web:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/farukylmz0550/bookshelf-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
