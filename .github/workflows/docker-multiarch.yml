name: Build and Push Multi-Arch Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true
        default: "v3.22.1"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/farukylmz0550/bookshelf

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Verify Rust core on target architecture
        run: |
          cargo test --manifest-path rust/reading_core/Cargo.toml
          cargo build --manifest-path rust/reading_core/Cargo.toml --target "${{ matrix.rust-target }}"
      - name: Require stable Server Action encryption key
        env:
          SERVER_ACTIONS_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: test -n "$SERVER_ACTIONS_KEY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          provenance: mode=max
          sbom: true

  publish-manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ inputs.tag }}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${{ inputs.tag }}-amd64" \
            "${IMAGE}:${{ inputs.tag }}-arm64"
